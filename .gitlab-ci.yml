image: node:22-alpine

stages:
  - validate
  - test
  - build
  - deploy-preview
  - deploy-prod
  - post-deploy

variables:
  BUN_VERSION: "1.3.9"

.bun-setup: &bun-setup
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun install --frozen-lockfile

# ── Validate ──────────────────────────────────────────────────────
lint:
  stage: validate
  <<: *bun-setup
  script:
    - bun run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

typecheck:
  stage: validate
  <<: *bun-setup
  script:
    - bunx tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# ── Test ──────────────────────────────────────────────────────────
unit-tests:
  stage: test
  <<: *bun-setup
  script:
    - bun run test --run
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# ── Build ─────────────────────────────────────────────────────────
build-next:
  stage: build
  <<: *bun-setup
  script:
    - bun run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

# ── Deploy Preview (MRs) ──────────────────────────────────────────
deploy-preview:
  stage: deploy-preview
  <<: *bun-setup
  script:
    - bunx vercel --token=$VERCEL_TOKEN --yes
  environment:
    name: preview/$CI_MERGE_REQUEST_IID
    url: $CI_ENVIRONMENT_URL
  rules:
    - if: $CI_MERGE_REQUEST_IID

# ── Deploy Production ─────────────────────────────────────────────
deploy-prod:
  stage: deploy-prod
  <<: *bun-setup
  script:
    - bunx vercel --token=$VERCEL_TOKEN --prod --yes
  environment:
    name: production
    url: https://lioncompress.dev
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

# ── Post Deploy ───────────────────────────────────────────────────
lighthouse:
  stage: post-deploy
  image: cypress/browsers:node22-chrome130
  script:
    - npx @lhci/cli@0.14 autorun
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
