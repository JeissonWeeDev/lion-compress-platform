name: Feature request
description: Suggest a new capability or a UX improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. Concrete use
        cases help prioritize the request.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today?
      placeholder: "When I compress 40 images, I only want to download 12 of them..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Compression engine
        - User interface / usability
        - Performance
        - Internationalization
        - SEO / discoverability
        - Developer experience
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and the backlog before opening this one.
          required: true
